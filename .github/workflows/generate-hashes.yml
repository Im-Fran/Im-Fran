name: Generate Hashes

on:
  pull_request:
    branches: [dev]
    paths-ignore:
      - ".hashes.json"

jobs:
  generate-hashes:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Generate SHA-512 hashes for all dotfiles
        run: |
          python3 - <<'EOF'
          import json
          import hashlib
          import os
          from datetime import datetime, timezone

          files = {}
          for root, dirs, filenames in os.walk('dotfiles'):
              dirs.sort()
              for filename in sorted(filenames):
                  filepath = os.path.join(root, filename)
                  with open(filepath, 'rb') as f:
                      sha512 = hashlib.sha512(f.read()).hexdigest()
                  files[filepath] = sha512

          result = {
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'commit': os.environ.get('GITHUB_SHA', 'unknown'),
              'files': files
          }

          with open('.hashes.json', 'w') as f:
              json.dump(result, f, indent=2)
              f.write('\n')

          print(f'Generated SHA-512 hashes for {len(files)} files')
          EOF

      - name: Commit .hashes.json via API (verified)
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = '.hashes.json';
            const branch = process.env.HEAD_REF;

            const newContent = fs.readFileSync(path, 'utf8');
            const newContentB64 = Buffer.from(newContent).toString('base64');

            let existingSha;
            let existingContent;
            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: branch,
              });
              existingSha = data.sha;
              existingContent = Buffer.from(data.content, 'base64').toString('utf8');
            } catch (err) {
              if (err.status !== 404) throw err;
            }

            if (existingContent === newContent) {
              core.info('No changes to .hashes.json');
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'chore: update .hashes.json',
              content: newContentB64,
              sha: existingSha,
              branch,
            });

            core.info('Committed updated .hashes.json');
        env:
          HEAD_REF: ${{ github.head_ref }}
